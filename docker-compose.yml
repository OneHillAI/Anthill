version: "3.9"

# anthill Phase 3 demo: 1 orchestrator + 2 node agents.
#
# Start everything:
#   docker compose up --build
#
# Interact from another terminal:
#   # ingest a doc into node-1
#   docker compose exec node-1 anthill -w /data/wiki ingest /data/docs/architecture-decisions.md
#   # ask - checks local cache, then org index, then generates
#   docker compose exec node-1 anthill -w /data/wiki ask "which DB for billing?" --org-url http://orchestrator:8080
#   # ask from node-2 - gets an org cache hit (no inference needed)
#   docker compose exec node-2 anthill -w /data/wiki ask "which DB for billing?" --org-url http://orchestrator:8080
#   # run the maintenance agent
#   docker compose exec node-1 anthill -w /data/wiki agent run --org-url http://orchestrator:8080
#   # promote a page
#   docker compose exec node-1 anthill -w /data/wiki promote architecture-decisions --org-url http://orchestrator:8080 --node-id node-1
#   # check the org index
#   curl http://localhost:8080/cache/stats
#   curl http://localhost:8080/wiki/pages
#
# Requires: Ollama running on the host at host.docker.internal:11434

x-node-env: &node-env
  ANTHILL_BACKEND: ollama
  ANTHILL_MODEL: qwen2.5:3b
  ANTHILL_BASE_URL: http://host.docker.internal:11434
  ANTHILL_ORG_URL: http://orchestrator:8080

x-node-base: &node-base
  build: .
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./certs:/certs:ro
    - ./demo-docs:/data/docs:ro
  networks:
    - anthill
  depends_on:
    orchestrator:
      condition: service_healthy

services:
  orchestrator:
    build: .
    command: uvicorn anthill.orchestrator.app:app --host 0.0.0.0 --port 8080
    environment:
      ANTHILL_ORG_WIKI: /data/org-wiki
      ANTHILL_CENTRAL_INDEX: /data/central-index
    volumes:
      - org-wiki:/data/org-wiki
      - central-index:/data/central-index
      - ./certs:/certs:ro
    ports:
      - "8080:8080"
    networks:
      - anthill
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-1:
    <<: *node-base
    # Runs the node agent server (heartbeats + peer cache fetch) and sleeps.
    # Use 'docker compose exec node-1 anthill ...' for interactive commands.
    command: >
      sh -c "anthill -w /data/wiki init &&
             anthill -w /data/wiki serve --port 9001 --org-url http://orchestrator:8080 --node-id node-1"
    environment:
      <<: *node-env
      ANTHILL_NODE_ID: node-1
      ANTHILL_NODE_BASE_URL: http://node-1:9001
      ANTHILL_WORKSPACE: /data/wiki
    volumes:
      - node-1-wiki:/data/wiki
      - ./certs:/certs:ro
      - ./demo-docs:/data/docs:ro
    ports:
      - "9001:9001"

  node-2:
    <<: *node-base
    command: >
      sh -c "anthill -w /data/wiki init &&
             anthill -w /data/wiki serve --port 9002 --org-url http://orchestrator:8080 --node-id node-2"
    environment:
      <<: *node-env
      ANTHILL_NODE_ID: node-2
      ANTHILL_NODE_BASE_URL: http://node-2:9002
      ANTHILL_WORKSPACE: /data/wiki
    volumes:
      - node-2-wiki:/data/wiki
      - ./certs:/certs:ro
      - ./demo-docs:/data/docs:ro
    ports:
      - "9002:9002"

volumes:
  org-wiki:
  central-index:
  node-1-wiki:
  node-2-wiki:

networks:
  anthill:
    driver: bridge
