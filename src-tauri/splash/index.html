<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anthill</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f1115;
        color: #e6e8ec;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .mark {
        width: 64px; height: 64px; border-radius: 16px;
        background: linear-gradient(135deg, #ffb020, #ff7a18);
      }
      .label { font-size: 15px; letter-spacing: 0.2px; opacity: 0.85; }
      .dots { display: flex; gap: 6px; }
      .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #ff9a2e;
        animation: pulse 1.2s infinite ease-in-out;
      }
      .dot:nth-child(2) { animation-delay: 0.15s; }
      .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true"></div>
      <div class="label">Starting Anthill</div>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
    <!-- The shell navigates this window to http://127.0.0.1:<port> once the backend is up. -->
  </body>
</html>
