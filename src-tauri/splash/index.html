<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anthill</title>
    <style>
      :root {
        color-scheme: light dark;
        /* Same palette as the web app's :root tokens (anthill/web/static/style.css) so the splash
           reads as a continuation of the app rather than a generic loader. Duplicated, not shared,
           because this window renders before the backend exists to serve that stylesheet - the splash
           must stay fully self-contained (no assets, no network; see the closing comment below). */
        --bg: #F7F8FA;
        --text: #20201E;
        --accent: #2F6B4F;      /* the hill's dome - matches --accent */
        --accent-dk: #255A41;   /* the hill's strata lines + ground - matches --accent-dk */
        --hill-entrance: #0E2117;
        --hill-shadow: rgba(20, 22, 28, .14);
        --ant: #D48926;         /* matches assets/ant-mark.png's body colour */
        --ant-dk: #A8631A;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141619;
          --text: #EAECEF;
          --accent: #4E9E78;
          --accent-dk: #3E8A66;
          --hill-shadow: rgba(0, 0, 0, .42);
        }
      }
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }

      /* ── The hill (brand mark, redrawn as inline SVG - see assets/anthill-mark.png) ── */
      .hill svg { display: block; width: 148px; height: auto; }
      .hill-dome { fill: var(--accent); }
      .hill-arc { fill: none; stroke: var(--accent-dk); stroke-width: 5; stroke-linecap: round; }
      .hill-entrance { fill: var(--hill-entrance); }
      .hill-ground { fill: var(--accent-dk); }
      .hill-shadow { fill: var(--hill-shadow); }

      /* ── The ants (running toward the hill) ──
         Each <svg class="ant"> is a full, independent copy (not a shared <symbol>/<use>) so the
         per-instance --d stagger is plain, guaranteed-to-inherit CSS custom-property cascade rather
         than something riding on <use> shadow-tree inheritance. */
      .trail {
        display: flex;
        align-items: flex-end;
        gap: 9px;
        animation: ant-creep 2.6s ease-in-out infinite;
      }
      .ant { display: block; width: 38px; height: auto; }
      .ant-part { fill: var(--ant); }
      .ant-eye { fill: var(--hill-entrance); }
      .ant-antenna { fill: none; stroke: var(--ant-dk); stroke-width: 1.6; stroke-linecap: round; }
      .ant-legs path {
        fill: none; stroke: var(--ant-dk); stroke-width: 2.6;
        stroke-linecap: round; stroke-linejoin: round;
      }
      /* A 2-frame running cycle: legs-a and legs-b are the same three legs in two alternating
         positions, hard-cut with steps(1) rather than crossfaded, so it reads as a quick trot
         instead of a blur. The whole ant bobs in sync with the same cadence. */
      .ant-legs-b { opacity: 0; }
      .ant-body, .ant-legs-a, .ant-legs-b {
        animation-duration: .32s;
        animation-iteration-count: infinite;
        animation-delay: var(--d, 0s);
      }
      .ant-body { animation-name: ant-bob; animation-timing-function: ease-in-out; }
      .ant-legs-a { animation-name: ant-step-a; animation-timing-function: steps(1); }
      .ant-legs-b { animation-name: ant-step-b; animation-timing-function: steps(1); }
      @keyframes ant-step-a { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes ant-step-b { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
      @keyframes ant-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
      @keyframes ant-creep { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }

      .caption { font-size: 20px; font-weight: 700; letter-spacing: .1px; }

      @media (prefers-reduced-motion: reduce) {
        .trail, .ant-body, .ant-legs-a, .ant-legs-b { animation: none !important; }
        .ant-legs-a { opacity: 1; }
        .ant-legs-b { opacity: 0; }
      }
    </style>
  </head>
