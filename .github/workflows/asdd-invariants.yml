# ASDD - core-pillar invariant suites.
#
# Runs the tests tagged privacy_invariant / knowledge_invariant / model_invariant (the markers are
# registered in pyproject.toml). These guard the charters' MUST-invariants.
#
# REPORT-ONLY: this is intentionally not yet a required status check, so a failure is visible but does
# not block merge (the ratified ~2-week rollout). Flip it to blocking by adding it to branch protection
# once the suites have real coverage. Today the suites are a seed (a few existing guards); more tests
# join as each invariant in the manifest is built.

name: ASDD invariants (report-only)

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]  # report-only, so skipping docs-only PRs cannot block a merge
  push:
    branches: [main]

concurrency:
  group: invariants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"
      - name: Core-pillar invariant suites (report-only)
        run: pytest -m "privacy_invariant or knowledge_invariant or model_invariant" -q
