name: changelog-fragment
# Advisory (non-blocking): nudge a PR that changes product code to add a changelog.d/ fragment, so
# user-facing changes get an entry. It only ever warns - it never fails a build - mirroring the
# spec-gate philosophy. chore / docs-only PRs need no fragment. See docs/specs/changelog-fragments.md.
on:
  pull_request:

# Cost: a newer push to the same PR cancels the in-flight run instead of paying for both
# (same cancel-superseded pattern as ci/pr-validation/supply-chain; see docs/CI_COST.md).
concurrency:
  group: changelog-fragment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  advise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Advise a changelog fragment for user-facing changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          frag_re='^changelog\.d/.+\.(added|changed|deprecated|removed|fixed|security)\.md$'
          if echo "$changed" | grep -qE '^anthill/' && ! echo "$changed" | grep -qE "$frag_re"; then
            echo "::warning::This PR changes anthill/ but adds no changelog.d/ fragment. If it is user-facing, add changelog.d/<id>.<category>.md (see changelog.d/README.md). Advisory only - this never blocks the merge."
          else
            echo "changelog-fragment check: ok (fragment present, or no product code changed)."
          fi
