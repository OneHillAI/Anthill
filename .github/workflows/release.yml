name: Release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# BEFORE tagging: bump pyproject.toml's version and add a matching "## [x.y.z]" section to
# CHANGELOG.md - the gate below fails the release if either is missing (so no version ever
# ships undocumented).
# Builds the Anthill-Appliance.pkg on macOS and attaches it to the GitHub Release. The desktop app
# itself is the auto-updating Tauri build, published separately by desktop-release.yml (the old
# self-contained PyInstaller dmg is retired). Signing + notarization (Apple Developer ID) run only if the secrets
# are present (else unsigned). Secrets to add (see docs/RELEASE_SIGNING.md):
#   MACOS_CERT_P12 / MACOS_CERT_PASSWORD          - a .p12 with the Developer ID Application
#                                                   AND Developer ID Installer certs, base64'd
#   MACOS_SIGN_IDENTITY                           - "Developer ID Application: NAME (TEAMID)"
#   MACOS_INSTALLER_IDENTITY                      - "Developer ID Installer: NAME (TEAMID)"
#   AC_API_KEY_ID / AC_API_ISSUER_ID / AC_API_KEY_B64 - App Store Connect API key (notarization)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Cost: GitHub-hosted macOS bills at 10x. Set the MACOS_RUNNER repo variable to a self-hosted label
    # (e.g. your always-on Mac Mini) to build for free; defaults to GitHub's macos-14 (Apple Silicon).
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-14' }}
    # Hard ceiling on a 10x-billed macOS runner. The notarytool waits are individually capped
    # (scripts/build-*.sh --timeout); this is the backstop so nothing can ever idle for hours
    # again. GitHub's default is 6h - an uncapped notarization wait once ran 4h40m (~$22) when
    # Apple's Notary queue stalled. A normal signed release finishes in ~12 min.
    timeout-minutes: 50
    # Secrets are hoisted to job env because GitHub forbids the `secrets` context in a step
    # `if:` condition. Steps gate on env.* instead (empty when a secret is unset -> unsigned).
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
      AC_API_KEY_B64: ${{ secrets.AC_API_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4

      # Gate: the tagged version must be changelogged and match pyproject. Fails fast (before
      # the build) so an undocumented version is never published. Tag pushes only;
      # workflow_dispatch on a branch skips it.
      - name: Verify the version is changelogged
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/check-release.sh --release "${{ github.ref_name }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # Optional signing: import the Developer ID cert(s) into a temp keychain when the secret
      # exists. One .p12 carrying BOTH the Application and Installer certs lets codesign (app)
      # and productbuild (pkg) sign. Without it, the build is unsigned (still usable).
      - name: Import signing certificate (if configured)
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"

      # Decode the App Store Connect API key once; both builds notarize with it (via env).
      - name: Prepare notarization key (if configured)
        if: ${{ env.AC_API_KEY_B64 != '' }}
        run: |
          echo "$AC_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"
          echo "AC_API_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8" >> "$GITHUB_ENV"

      # The standalone PyInstaller dmg is retired: the canonical Mac download is now the auto-updating
      # Tauri build, published by desktop-release.yml. This workflow only ships the appliance pkg.
      - name: Build the appliance pkg (signed + notarized when configured)
        env:
          INSTALLER_ID: ${{ env.MACOS_INSTALLER_IDENTITY }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          bash scripts/build-appliance-pkg.sh

      - name: Write release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Anthill ${{ github.ref_name }}

          Signed and notarized by Apple - **just open it**, no Gatekeeper warning. The app **updates itself** from then on, so you only download it once.

          **[Download for Mac](https://github.com/OneHillAI/Anthill/releases/latest/download/Anthill.dmg)** - the `.dmg` downloads directly. Open it, drag **Anthill** into Applications, and launch it. (Want a specific version? Grab the `.dmg` from the **Assets** below.)

          **What to expect:** the download is **~170 MB**. On **first launch** it fetches the local AI engine (**~140 MB**) and your local model (**~2 GB**) automatically, shown as "preparing your local AI" - so keep **~4 GB of free disk** and a network connection for that first run. After that it runs offline, and future updates install themselves in the background.

          Running a Mac as your team's always-on backend? Also grab **Anthill-Appliance.pkg** from the assets - double-click to make this Mac the always-on org backend (never sleeps, restarts after a power cut, serves the team on the LAN). Install the app first.

          ### Build from source (Mac fallback)
          ```bash
          git clone https://github.com/OneHillAI/Anthill.git
          cd Anthill && bash start.sh
          ```
          Full build/operate docs: [CONTRIBUTING.md](https://github.com/OneHillAI/Anthill/blob/main/CONTRIBUTING.md).
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Anthill-Appliance.pkg
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
