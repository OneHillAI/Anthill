# Publish the frontier model catalog to anthill.run, refreshed daily.
#
# Regenerates www/model-catalog.json from the vetted seed (anthill/hosting/model_catalog.json) and flags
# tag/metadata drift + new frontier models (see scripts/gen_model_catalog.py). If the catalog changed, it
# signs it and publishes the catalog and its signature to the OneHillAI/anthill.run repo; Cloudflare Pages
# is git-connected to that repo and deploys on push, so Anthill's "Refresh models" button picks up the new
# frontier with no app release.
#
# Why a separate repo: Cloudflare's GitHub App cannot see this private monorepo, so it cannot deploy from
# it. OneHillAI/anthill.run is a small, dedicated publish target the owner connects to Cloudflare instead.
# This job SIGNS here (keeping the Sigstore identity in this repo - see below) and pushes only the catalog
# and its signature there; it never writes to this repo (contents: read), so main stays fully protected.
#
# That repo's root is also the live landing site (pages, chat widget, Functions), which is authored there,
# not here. So the publish step adds or updates exactly two files and refuses to push anything else. It
# must never mirror a folder over the repo: a mirror with --delete wiped the landing site on 2026-10-04.
#
# Runs on the default branch only (GitHub cron requirement). Also runs when the seed or generator changes,
# so a curated edit republishes immediately. The bot commits to the anthill.run repo, not this one, so it
# cannot re-trigger itself.
#
# Intelligence scores are the curated editorial values in the seed - no external API and no secret. The
# generator has an OPTIONAL Artificial Analysis integration (set AA_API_KEY to enable), but it is OFF here on
# purpose: AA's free Data API is "internal use, no redistribution", and this catalog is published publicly,
# which would be redistribution; the paid tier is not warranted. Scores update when the seed is curated.

name: Refresh model catalog

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  push:
    branches: [main]
    paths:
      - "anthill/hosting/model_catalog.json"
      - "scripts/gen_model_catalog.py"
      - "scripts/model_catalog_sources.py"
      - ".github/workflows/refresh-model-catalog.yml"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Sign + publish even if the catalog is unchanged (use once to bootstrap, or to re-sign). Publishes only the catalog and its signature."
        type: boolean
        default: false

concurrency:
  group: refresh-model-catalog
  cancel-in-progress: false

permissions:
  contents: read  # publishing goes to the anthill.run repo via a deploy token; this repo is never written
  id-token: write  # keyless Sigstore signing: this workflow's OIDC identity IS the signing credential

env:
  DEPLOY_REPO: OneHillAI/anthill.run  # the Cloudflare-connected publish target (dedicated, so CF can see it)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx + sigstore
        # httpx is the generator's only dependency; sigstore signs the result. Keeping the install tiny (no
        # torch/embeddings) makes the daily job fast; validate_rows() already enforces the loader contract.
        run: pip install "httpx>=0.27,<1.0" "sigstore>=4,<5"

      - name: Regenerate the catalog
        # No AA_API_KEY passed on purpose (see header): the job runs seed-only, keeping the curated
        # intelligence scores. It still verifies tags against the Ollama registry and flags new models.
        run: python scripts/gen_model_catalog.py

      - name: Clone the deploy repo (anthill.run)
        # The freshly signed site is pushed here; Cloudflare Pages (git-connected to this repo) deploys it.
        # A repo-scoped deploy token, not this repo's GITHUB_TOKEN: the deploy target is a different repo.
        env:
          DEPLOY_TOKEN: ${{ secrets.ANTHILL_RUN_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::error::ANTHILL_RUN_DEPLOY_TOKEN is not set. Add a fine-grained PAT (or deploy key) with"
            echo "::error::Contents read+write on ${DEPLOY_REPO} as a repo secret. See www/README.md."
            exit 1
          fi
          # Feed the token through a credential helper that reads it from the env at call time, so the literal
          # token never lands in a URL / argv (visible in process listings) or in a config file.
          git config --global --replace-all credential.helper \
            '!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "$DEPLOY_TOKEN"; }; f'
          # A normal (not --depth 1) clone so an empty deploy repo bootstraps cleanly on the first run.
          git clone "https://github.com/${DEPLOY_REPO}.git" deploy

      - name: Decide whether to publish
        id: decide
        # The PUBLISHED catalog is the source of truth for "did it change": compare the regenerated file to
        # what anthill.run is serving now. Unchanged => skip, which keeps the existing signature valid (the
        # bundle carries a signed timestamp + Rekor inclusion proof, so it never needs re-signing) and avoids
        # a pointless redeploy (#618). Missing (empty deploy repo) => first publish. Forced => always.
        run: |
          set -euo pipefail
          if [ ! -f deploy/model-catalog.json ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "First publish (deploy repo has no catalog yet)."
          elif ! cmp -s www/model-catalog.json deploy/model-catalog.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Catalog changed; will publish."
          elif [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "Forced publish."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Catalog unchanged; nothing to publish."
          fi

      - name: Sign the catalog (keyless - no private key exists)
        if: steps.decide.outputs.publish == 'true'
        # GitHub's OIDC proves this workflow's identity, Fulcio issues a short-lived cert for it, Rekor
        # records the event publicly. Clients verify the IDENTITY (anthill/hosting/catalog_trust.py), so
        # there is no key to steal, rotate, or guard. Signing stays in THIS repo (the identity is pinned to
        # ...refresh-model-catalog.yml@refs/heads/main here), even though the artifact is served from the
        # anthill.run repo - so moving the publish target did not change what the client verifies.
        run: |
          python -m sigstore sign www/model-catalog.json \
            --bundle www/model-catalog.json.sigstore.json --overwrite

      - name: Publish the signed catalog to anthill.run (Cloudflare deploys it)
        if: steps.decide.outputs.publish == 'true'
        # Copy the catalog and its signature into the deploy repo root, then commit + push to its main. They
        # go together or not at all: a client refuses an unsigned catalog. Nothing else is copied and nothing
        # is deleted: the rest of that repo is the live landing site, authored there. Cloudflare Pages serves
        # the repo root, so both files land next to the site.
        env:
          DEPLOY_TOKEN: ${{ secrets.ANTHILL_RUN_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          cp www/model-catalog.json www/model-catalog.json.sigstore.json deploy/
          cd deploy
          git config user.name "anthill-catalog-bot"
          git config user.email "dev@onehill.org"
          git add -- model-catalog.json model-catalog.json.sigstore.json
          # Guard: the commit may add or change those two files and nothing else. A deletion, a rename or any
          # other staged path stops the job before it pushes.
          if git diff --cached --name-status | grep -v -E '^[AM][[:space:]]+model-catalog\.json(\.sigstore\.json)?$'; then
            echo "::error::Refusing to publish: something other than the catalog and its signature is staged."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Deploy repo already up to date."
            exit 0
          fi
          git commit -m "Publish signed model catalog"
          # The clone step set a global credential helper that supplies the token from the env, so the plain
          # https remote (origin) authenticates without the token appearing in argv.
          git push origin HEAD:main
