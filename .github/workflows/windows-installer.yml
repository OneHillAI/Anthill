# Windows installer: build the real NSIS installer and test it as a user would (spec: docs/specs/windows-support.md, Phase C).
#
# It runs on the pull request itself, only when the PR touches the desktop shell, the sidecar build, the platform
# layer or this check. The job builds the backend and the Tauri shell, installs the unsigned installer silently for
# the current user, starts the real app, requires the backend to answer and the window to show, kills the app the
# hard way and requires the backend to go by itself, starts it again, closes it normally and requires nothing to be
# left, then uninstalls and requires the user's data to stay (scripts/windows_installer_check.py).
#
# Nothing here is signed or published, and the updater feed is switched off for the build because pull requests
# have no signing key. It is advisory: a path-filtered check cannot be a required one.
name: Windows installer

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/build-sidecar.sh"
      - "scripts/windows_installer_check.py"
      - "Anthill-sidecar.spec"
      - "anthill/desktop.py"
      - "anthill/platform_layer.py"
      - "tests/test_windows_installer_check.py"
      - ".github/workflows/windows-installer.yml"

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer builds, installs, runs and uninstalls
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: dtolnay/rust-toolchain@stable

      # Cache the Rust build (registry + src-tauri/target) so re-runs do not recompile the whole dependency tree.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The one-file backend the shell bundles as its sidecar (anthill-server-x86_64-pc-windows-msvc.exe).
      - name: Build the anthill-server sidecar
        run: bash scripts/build-sidecar.sh

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # Tauri embeds the icons at build time and src-tauri/icons is not committed, so generate the set first.
      - name: Generate app icons
        run: tauri icon assets/anthill-icon-1024.png

      # Pull requests have no updater signing key, so the build must not try to produce signed update bundles.
      - name: Build the installer (unsigned, no update bundles)
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/ci.conf.json"
          tauri build --bundles nsis --config "$RUNNER_TEMP/ci.conf.json"
          ls -la src-tauri/target/release/bundle/nsis/

      - name: Install it, run it, crash it, close it, uninstall it
        run: |
          INSTALLER=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          python scripts/windows_installer_check.py "$INSTALLER"

      - name: Stop anything left running
        if: always()
        run: |
          taskkill //F //IM Anthill.exe || true
          taskkill //F //IM anthill-server.exe || true
          taskkill //F //IM ollama.exe || true
