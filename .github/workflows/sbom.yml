name: sbom

# Software Bill of Materials (Assure layer, issue #355). Generates a CycloneDX SBOM of the app's
# runtime dependency set so every build has an auditable, machine-readable inventory of what ships.
# It is built from requirements.lock, the pinned set the packaged app installs, and runs when that lock or
# pyproject.toml changes, on main, and on demand, so the generation is exercised in CI; the release
# workflow can later download and attach this SBOM to the GitHub Release (owner-verified, not here).
on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements.lock"
      - ".github/workflows/sbom.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install what the app ships (the pinned, hash-checked lock)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .
      - name: Install CycloneDX generator
        run: pip install "cyclonedx-bom>=7,<8"
      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment --of JSON -o sbom.cyclonedx.json
          python -c "import json; d=json.load(open('sbom.cyclonedx.json')); n=len(d.get('components', [])); print(f'CycloneDX {d[\"specVersion\"]}, {n} components'); assert d.get('bomFormat')=='CycloneDX' and n>0, 'empty or invalid SBOM'"
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error
