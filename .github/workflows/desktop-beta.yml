# Cut Beta: build a signed, notarized "Anthill Beta" release candidate on demand, from main.
#
# A beta is a snapshot of main at one commit (it contains every PR merged up to then), published as a GitHub
# PRE-RELEASE (v<X.Y.Z>-rc.<N>). GitHub's "latest" release ignores pre-releases, so the live app's update
# feed (releases/latest) never sees a beta. Beta apps follow a separate rolling feed, the "beta-channel"
# pre-release, and have their own name, bundle id and data folder (src-tauri/tauri.beta.conf.json), so they
# install next to the live app and cannot touch its data.
#
# Nothing here publishes a stable release. A stable release is made only by the Promote workflow, after the
# founder's approval, from a beta that was tested as is. See docs/specs/beta-release-lane.md.
#
# It is started by hand: Actions, "Cut Beta", Run workflow. Use dry_run first: it builds and signs without
# creating a tag or a release, which proves the build before anything is published.
#
# The macOS steps are copied from desktop-release.yml on purpose (the stable path is left untouched); fold
# them into one reusable workflow only after the first stable release has gone through the new lane.

name: Cut Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version, X.Y.Z-rc.N (for example 1.1.0-rc.1). Its base must be higher than the current release; N is one more than the last beta."
        required: true
        type: string
      dry_run:
        description: "Build and sign only; create no tag, release or feed (use this first)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cut-beta
  cancel-in-progress: false

jobs:
  beta:
    # Cost: GitHub-hosted macOS bills at 10x. Set the MACOS_RUNNER repo variable to a self-hosted label to
    # build for free; defaults to GitHub's macos-14 (Apple Silicon). A beta is on demand, so this is rare.
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-14' }}
    timeout-minutes: 90
    env:
      SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      AC_API_KEY_B64: ${{ secrets.AC_API_KEY_B64 }} # App Store Connect API key (for notarization)
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A beta is only ever cut from main, so what is tested is what is on main.
      - name: Refuse anything but main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Cut Beta only runs from main (this run is on ${GITHUB_REF})."; exit 1
          fi

      - name: Signing not configured - skipping
        if: ${{ env.SIGN_KEY == '' }}
        run: |
          echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; a beta cannot be signed, so none is built."; exit 1

      # The version rules (X.Y.Z-rc.N, base above the current release, N exactly one more than the last beta)
      # live in scripts/beta_release.py, where they are tested.
      - name: Check the version
        run: |
          STABLE="$(python3 scripts/beta_release.py stable-version)"
          python3 scripts/beta_release.py check --version "$VERSION" --stable "$STABLE" --tags "$(git tag -l)"

      # Do not build a commit whose required checks are not green.
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs' | jq -s 'add' > "$RUNNER_TEMP/check-runs.json"
          python3 scripts/beta_release.py ci-green "$RUNNER_TEMP/check-runs.json"

      # What is in this beta: the changes waiting for the next release (read-only, from the fragments).
      - name: Draft the beta notes
        id: notes
        run: |
          {
            echo "Beta ${VERSION}: a release candidate cut from main at ${GITHUB_SHA}. It contains every change merged up to that commit."
            echo
            echo "Changes since the last stable release:"
            echo
            python3 scripts/build_changelog.py --draft || echo "(no pending changelog fragments)"
          } > "$RUNNER_TEMP/beta-notes.md"
          { echo "body<<NOTES_EOF"; cat "$RUNNER_TEMP/beta-notes.md"; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"


      - uses: actions/setup-python@v5
        if: ${{ env.SIGN_KEY != '' }}
        with:
          python-version: "3.11"
      # uv comes from a commit-pinned action, not from a script piped straight into a shell: that is a
      # supply-chain risk, and the security scan blocks it on any line a PR adds.
      - name: Install uv
        if: ${{ env.SIGN_KEY != '' }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.SIGN_KEY != '' }}
      # Cache the Rust build (registry + src-tauri/target) so re-runs reuse compiled deps - the first
      # Tauri build pulls a large dependency tree, and without this every run recompiles it from zero.
      - uses: Swatinem/rust-cache@v2
        if: ${{ env.SIGN_KEY != '' }}
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        if: ${{ env.SIGN_KEY != '' }}
        with:
          node-version: "20"

      # The beta builds, updates and displays as the rc. Patched in the checkout only, never committed.
      - name: Set the beta version in the checkout
        run: python3 scripts/beta_release.py apply --version "$VERSION"


      # Build the backend sidecar (one-file PyInstaller binary) the Tauri app bundles as externalBin.
      - name: Build the anthill-server sidecar
        if: ${{ env.SIGN_KEY != '' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/build-sidecar.sh


      # Prebuilt CLI (npm ships compiled binaries) instead of `cargo install tauri-cli`, which
      # recompiled the CLI from source every run (~10 min). tauriScript below calls `tauri`.
      - name: Install the Tauri CLI
        if: ${{ env.SIGN_KEY != '' }}
        run: npm install -g @tauri-apps/cli@^2


      # Tauri embeds the app/window icons at build time (tauri::generate_context!), and src-tauri/icons
      # is gitignored, so generate the full icon set first. Use the 1024 master (tauri icon wants
      # 1024x1024) so the largest icon slots are crisp, not upscaled from the 512 mark.
      - name: Generate app icons
        if: ${{ env.SIGN_KEY != '' }}
        run: tauri icon assets/anthill-icon-1024.png


      # Decode the App Store Connect API key (.p8) so tauri-action can NOTARIZE the app with it (same
      # key release.yml uses). APPLE_API_KEY_PATH in the build env points at it.
      - name: Prepare Apple notarization key
        if: ${{ env.SIGN_KEY != '' && env.AC_API_KEY_B64 != '' }}
        run: |
          echo "$AC_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ac_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8" >> "$GITHUB_ENV"

      # Build + sign + notarize the "Anthill Beta" app and its updater artifacts, with the beta identity
      # overlay. With dry_run, tagName is empty: build only, nothing is created. Otherwise it publishes a
      # PRE-RELEASE for v<version> (never "latest").
      - name: Build + publish the beta app and update artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.AC_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.AC_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ inputs.dry_run == false && format('v{0}', inputs.version) || '' }}
          # Pin the tag to the commit that was built, not to whatever main is when the release is created.
          commitish: ${{ github.sha }}
          releaseName: ${{ inputs.dry_run == false && format('Anthill Beta {0}', inputs.version) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          tauriScript: tauri
          projectPath: .
          args: --config src-tauri/tauri.beta.conf.json


      # Self-check the SIGNED sidecar before we trust the build. The dead-on-launch class of bug
      # (macOS hardened-runtime library validation rejecting the sidecar's embedded, differently-
      # signed Python.framework) is INVISIBLE on the unsigned binary - it only surfaces once the
      # binary carries a hardened-runtime signature. So we test the signed sidecar pulled straight
      # out of the built .app: (1) assert its signature carries disable-library-validation (the exact
      # entitlement whose absence caused the regression), then (2) actually run it and require it to
      # bind a port - proving the embedded Python.framework loads. A crash here fails the build.
      # On a workflow_dispatch dry run this gates BEFORE any tag/release exists; on a tag push it is a
      # loud post-publish alarm (tauri-action publishes inline) - so validate via a dry run first.
      - name: Self-check the signed sidecar boots
        if: ${{ env.SIGN_KEY != '' }}
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target -path '*/bundle/macos/*.app' | head -1)
          if [ -z "$APP" ]; then echo "FAIL: no built .app found"; exit 1; fi
          SIDECAR="$APP/Contents/MacOS/anthill-server"
          if [ ! -x "$SIDECAR" ]; then echo "FAIL: sidecar missing at $SIDECAR"; exit 1; fi
          echo "Checking $SIDECAR"
          # (1) The exact regression guard: the signed sidecar MUST allow loading its differently
          # signed embedded framework, or library validation kills it on every user's machine.
          if ! codesign -d --entitlements :- "$SIDECAR" 2>/dev/null | grep -q 'com.apple.security.cs.disable-library-validation'; then
            echo "FAIL: sidecar signature is missing com.apple.security.cs.disable-library-validation"
            echo "      (this is the dead-on-launch regression - check bundle.macOS.entitlements)"
            exit 1
          fi
          echo "OK: sidecar carries disable-library-validation"
          # (2) Prove it actually boots: run headless and require a PORT= line + a live TCP listener.
          OUT="$RUNNER_TEMP/sidecar-selfcheck.log"
          ANTHILL_NO_BROWSER=1 "$SIDECAR" > "$OUT" 2>&1 &
          PID=$!
          PORT=""
          for _ in $(seq 1 60); do
            PORT=$(grep -oE 'PORT=[0-9]+' "$OUT" | head -1 | cut -d= -f2 || true)
            [ -n "$PORT" ] && break
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "FAIL: sidecar exited before binding a port"; cat "$OUT"; exit 1
            fi
            sleep 1
          done
          if [ -z "$PORT" ]; then
            echo "FAIL: sidecar never printed PORT= within 60s"; cat "$OUT"; kill "$PID" 2>/dev/null || true; exit 1
          fi
          # The sidecar prints PORT= BEFORE uvicorn finishes binding, so poll the socket with retries
          # (as the real Tauri shell does in wait_until_up) rather than probing once and racing the
          # bind - a single instant nc gave a false "not accepting connections" on a sidecar that was
          # about to come up.
          listening=0
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 "$PORT" 2>/dev/null; then listening=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "FAIL: sidecar exited before its port came up"; cat "$OUT"; exit 1
            fi
            sleep 1
          done
          if [ "$listening" = "1" ]; then
            echo "OK: signed sidecar bound and is accepting connections on port $PORT"
          else
            echo "FAIL: sidecar printed PORT=$PORT but never accepted a connection within 30s"; cat "$OUT"; kill "$PID" 2>/dev/null || true; exit 1
          fi
          kill "$PID" 2>/dev/null || true

      # tauri-action notarizes the .app but not the .dmg it wraps it in, so notarize + staple the dmg (as the
      # stable workflow does), then publish it on the beta release and on the rolling beta-channel feed under
      # a fixed name. The stable Anthill.dmg download link is NOT touched.
      - name: Notarize + staple the dmg and publish the beta feed
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          DMG=$(find src-tauri/target -path '*/bundle/dmg/*.dmg' | head -1)
          if [ -z "$DMG" ]; then echo "No dmg found under src-tauri/target"; exit 1; fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            xcrun notarytool submit "$DMG" \
              --key "$APPLE_API_KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          else
            echo "::warning::App Store Connect key absent - the beta dmg is NOT notarized."
          fi
          cp "$DMG" "$RUNNER_TEMP/Anthill-Beta.dmg"
          gh release upload "$TAG" "$DMG" --clobber
          # The rolling feed the beta app follows: latest.json (it points at this beta's own assets).
          gh release view beta-channel >/dev/null 2>&1 || gh release create beta-channel --prerelease \
            --target main --title "Anthill Beta feed" \
            --notes "The update feed that Anthill Beta apps follow. Not a release to download: see the versioned beta releases."
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          gh release upload beta-channel "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/Anthill-Beta.dmg" --clobber
          # Make sure neither is ever "latest": the live app's feed is the newest NON-pre-release.
          gh release edit "$TAG" --prerelease --latest=false
          gh release edit beta-channel --prerelease --latest=false

  # Windows alpha: built, install-checked and added to the beta by its own workflow, after the macOS job above has
  # published the beta. The macOS job is not changed by it.
  windows:
    needs: beta
    uses: ./.github/workflows/desktop-beta-windows.yml
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
