# PR contribution-guideline gates.
#
# Catches violations that are cheap to detect automatically and are easy to miss:
#   - CHANGELOG.md structural invariant: [Unreleased] section must always exist
#   - Feature PRs (pillar:feature label) must touch CHANGELOG.md
#   - pyproject.toml version and anthill/__init__.py version must match
#   - Known CVEs in direct dependencies (pip-audit)
#   - SAST: bandit on changed Python files (HIGH severity + HIGH confidence = hard block)
#   - License compatibility: UNKNOWN license in any dep = hard block; unrecognized = warning
#
# Relationship to the advisory review (pr-review.yml / security_scan.py):
#   - The advisory review runs bandit + deterministic rules at MEDIUM+MEDIUM and posts an
#     advisory comment. It can set a blocking commit status but only when
#     ASDD_RUNTIME_TOKEN is configured.
#   - This workflow is a HARD gate (always blocks merge regardless of secrets) at the
#     HIGH+HIGH threshold for true positives only. The two layers are complementary.
#
# Security posture: READ-ONLY token, no secrets, untrusted PR content is never
# interpolated into shell or prompts - only base/head SHAs from the GitHub context
# are used to drive git diff.

name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
    branches: [main]

permissions:
  contents: read

# Docs-only fast path, used by every "Detect docs-only change" step below. ci.yml
# keeps an identical copy of these two values (tests/test_ci_docs_only_fast_path.py checks that).
# A PR whose every changed path matches DOCS_ONLY_ALLOW, and none is in DOCS_ONLY_CARVE_OUT, skips
# the expensive install and check steps; the job itself still runs and reports success.
env:
  DOCS_ONLY_ALLOW: '^((docs|docs-site|changelog\.d)/[^[:space:]]*\.md|README\.md|CHANGELOG\.md)$'
  # A test or the app reads these files at runtime; add any new file a test reads here.
  # A PR touching any of them runs the full checks. Readers, at the time of writing:
  #   README.md          pyproject.toml `readme`, read by every `pip install -e .`
  #   CHANGELOG.md       tests/test_release_check.py (scripts/check-release.sh), tests/test_release_body.py
  #   docs/how-it-works.md, docs/setup.md
  #                      anthill/web/app.py (/docs/how-it-works, /docs/setup, _HELP_DOCS) via
  #                      tests/test_docs.py, test_web_app.py, test_nav_roles.py, test_profile_nav.py,
  #                      test_jwt_live_revocation.py; also docs-site/scripts/collect-docs.js
  #   docs/OKGF.md       anthill/web/app.py (/docs/okgf) via tests/test_okf.py
  #   docs/releasing.md  tests/test_stable_releases_start_as_prereleases.py
  #   the other docs/*.md below: docs-site/scripts/collect-docs.js FILES (a missing one throws at
  #                      deploy), guarded by tests/test_ci_docs_only_fast_path.py
  DOCS_ONLY_CARVE_OUT: |-
    README.md
    CHANGELOG.md
    docs/how-it-works.md
    docs/setup.md
    docs/OKGF.md
    docs/releasing.md
    docs/DOCS_OVERVIEW.md
    docs/USING_ANTHILL.md
    docs/using-chat-and-knowledge.md
    docs/using-automation.md
    docs/using-models-and-compute.md
    docs/using-connectors-and-personalization.md

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-and-version:
    name: Changelog & version consistency
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so git diff can compare base..head accurately.
          fetch-depth: 0

      - name: CHANGELOG.md must have an [Unreleased] section
        run: |
          if ! grep -qE "^## \[Unreleased\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md is missing the '## [Unreleased]' section. Add one at the top (see CONTRIBUTING.md - Releasing)."
            exit 1
          fi
          echo "CHANGELOG.md [Unreleased] section present."

      - name: Feature PRs must add a changelog fragment
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          is_feature=$(echo "$LABELS_JSON" | jq -r 'any(.[]; .name == "pillar:feature")')
          if [ "$is_feature" != "true" ]; then
            echo "Not a pillar:feature PR - no changelog requirement."
            exit 0
          fi
          fragment_re='^changelog\.d/.+\.(added|changed|deprecated|removed|fixed|security)\.md$'
          if ! git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE "$fragment_re"; then
            echo "::error file=changelog.d/README.md::pillar:feature PRs must add changelog.d/<id>.<category>.md. See CONTRIBUTING.md."
            exit 1
          fi
          python scripts/build_changelog.py --draft >/dev/null
          echo "Changelog fragment present and valid."

      - name: Version must be consistent across pyproject.toml and anthill/__init__.py
        run: |
          pyver=$(grep -E '^version[[:space:]]*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          initver=$(grep -E '^__version__' anthill/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$pyver" != "$initver" ]; then
            echo "::error::Version mismatch: pyproject.toml=${pyver} anthill/__init__.py=${initver}. Keep them in sync when bumping (CONTRIBUTING.md - Releasing)."
            exit 1
          fi
          echo "Version consistent: ${pyver}"

  dep-audit:
    name: Dependency vulnerability audit
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # A docs-only PR changes no dependency: auditing the identical, already-audited
      # dependency set on every such PR is pure wait with no signal. Allow-list, not
      # deny-list - any file outside docs/, docs-site/, changelog.d/ markdown, or any file in the
      # carve-out list in the workflow env above, runs the real audit. Same script as ci.yml.
      - name: Detect docs-only change
        id: docsonly
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Fail closed: anything this cannot positively classify as docs-only runs the full checks.
          # --no-renames lists a rename as a deletion of the old path plus an addition of the new
          # one, so moving anthill/x.py to docs/x.md still shows the code path and is not docs-only.
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ] &&
            status=$(git diff --name-status --no-renames "origin/${BASE_REF}...HEAD") &&
            [ -n "$status" ]; then
            docs_only=true
            while IFS= read -r line; do
              kind=${line%%$'\t'*}
              path=${line#*$'\t'}
              case "$kind" in
                A | D | M) ;;
                # T is a type change (a doc replaced by a symlink); any other status is unexpected.
                *) docs_only=false; break ;;
              esac
              case "$path" in
                # git C-quotes a name holding a quote, backslash, control or non-ASCII character.
                \"*) docs_only=false; break ;;
              esac
              if ! printf '%s\n' "$path" | grep -qE "$DOCS_ONLY_ALLOW" ||
                printf '%s\n' "$path" | grep -qxF -e "$DOCS_ONLY_CARVE_OUT"; then
                docs_only=false
                break
              fi
            done <<<"$status"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            echo "::notice::Docs-only change - skipping this job's install and check steps."
          fi

      - uses: actions/setup-python@v5
        if: steps.docsonly.outputs.docs_only != 'true'
        with:
          python-version: "3.11"

      - name: Install deps and pip-audit
        if: steps.docsonly.outputs.docs_only != 'true'
        # --timeout/--retries: the [ci] extra pulls in lancedb's large transitive wheels, which has
        # hit PyPI read-timeouts on a congested runner (see the security job's identical install
        # below, where this exact failure mode recurred on consecutive unrelated PRs).
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -e ".[ci]" pip-audit

      - name: Audit for known CVEs
        if: steps.docsonly.outputs.docs_only != 'true'
        # --skip-editable skips the local anthill package itself (no PyPI entry to check).
        # --desc on prints the CVE description inline for easier triage.
        # The step fails if any unfixed CVE is found in a direct or transitive dependency.
        #
        # There are no documented exceptions. The one old exception (PYSEC-2026-1325, ecdsa, which only
        # python-jose pulled in) went away when session tokens moved to PyJWT. Add an --ignore-vuln only with
        # a written reason.
        run: pip-audit --skip-editable --desc on

  security:
    name: SAST & license audit
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # License compatibility only needs re-checking when the dependency set could have
      # changed. The SAST step below already self-skips when no .py file changed (its own
      # CHANGED check), so it needs no condition here - this just saves installing bandit and
      # pip-licenses at all on a docs-only PR. Allow-list, not deny-list; same script as above.
      - name: Detect docs-only change
        id: docsonly
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Fail closed: anything this cannot positively classify as docs-only runs the full checks.
          # --no-renames lists a rename as a deletion of the old path plus an addition of the new
          # one, so moving anthill/x.py to docs/x.md still shows the code path and is not docs-only.
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ] &&
            status=$(git diff --name-status --no-renames "origin/${BASE_REF}...HEAD") &&
            [ -n "$status" ]; then
            docs_only=true
            while IFS= read -r line; do
              kind=${line%%$'\t'*}
              path=${line#*$'\t'}
              case "$kind" in
                A | D | M) ;;
                # T is a type change (a doc replaced by a symlink); any other status is unexpected.
                *) docs_only=false; break ;;
              esac
              case "$path" in
                # git C-quotes a name holding a quote, backslash, control or non-ASCII character.
                \"*) docs_only=false; break ;;
              esac
              if ! printf '%s\n' "$path" | grep -qE "$DOCS_ONLY_ALLOW" ||
                printf '%s\n' "$path" | grep -qxF -e "$DOCS_ONLY_CARVE_OUT"; then
                docs_only=false
                break
              fi
            done <<<"$status"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            echo "::notice::Docs-only change - skipping this job's install and check steps."
          fi

      - uses: actions/setup-python@v5
        if: steps.docsonly.outputs.docs_only != 'true'
        with:
          python-version: "3.11"

      - name: Install tooling
        if: steps.docsonly.outputs.docs_only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 bandit pip-licenses

      - name: SAST - bandit on changed Python files (HIGH+HIGH)
        # Scans only files changed in this PR to avoid pre-existing debt blocking contributors.
        # Threshold: HIGH severity + HIGH confidence (-lll -iii) = near-zero false-positives.
        # The advisory review (pr-review.yml / security_scan.py) also scans at MEDIUM+MEDIUM
        # and posts findings as comments - the two layers are complementary, not redundant.
        # Files under .github/ are trusted protected paths and excluded (reviewed by humans).
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | grep -E '\.py$' | grep -v '^\.github/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No Python files changed - skipping SAST."
            exit 0
          fi
          COUNT=$(echo "$CHANGED" | wc -l | tr -d ' ')
          echo "Running bandit (HIGH+HIGH) on ${COUNT} changed file(s):"
          echo "$CHANGED"
          echo "$CHANGED" | xargs bandit -lll -iii -q

      - name: License compatibility
        if: steps.docsonly.outputs.docs_only != 'true'
        # Blocks on UNKNOWN (pip-licenses could not find a license field at all - almost always a
        # packaging error or a bundled dep without metadata). Warns on licenses outside the
        # known-compatible set so a human can verify before merging.
        # AGPL-3.0 project: MIT, BSD, Apache, LGPL, MPL-2.0, ISC, and PSF are compatible.
        # pip-licenses reports SPDX identifiers ("MIT", "BSD-3-Clause", "Apache-2.0") so we
        # match by substring rather than exact equality against PyPI classifier strings.
        # Isolated venv prevents runner pre-installed packages (cuda-toolkit, etc.) from
        # poisoning the scan with UNKNOWN licenses unrelated to anthill's deps.
        run: |
          python3 -m venv /tmp/lic-venv
          # --retries/--timeout: this install (the [ci] extra pulls in lancedb's large transitive
          # wheels) has hit PyPI read-timeouts on a congested runner on consecutive unrelated PRs
          # (#6, #7) - pip's 15s default read timeout is too tight for a large download under any
          # network pressure. The job's own timeout-minutes is the backstop if a hang recurs anyway.
          /tmp/lic-venv/bin/pip install -q --retries 5 --timeout 60 -e ".[ci]" pip-licenses
          /tmp/lic-venv/bin/pip-licenses --format=json --with-license-file --output-file=licenses.json
          python3 - <<'PYEOF'
          import json, sys
          # Substring patterns matched case-insensitively against the SPDX identifier.
          # A license is compatible if any pattern appears in its lowercased string.
          COMPATIBLE_PATTERNS = [
              "mit",
              "bsd",
              "apache",
              "isc",
              "lgpl",
              "mpl",
              "mozilla",
              "psf",
              "python software",
              "python license",
              "agpl",      # anthill itself is AGPL-3.0-or-later
              "cc0",
              "public domain",
              "unlicense",
              "hpnd",
              "historical permission",
              "zope",
              "openssl",
              "eupl",
          ]
          # Skip NVIDIA/CUDA packages: lancedb pulls them in as transitive CUDA deps.
          # They are runtime-optional wheels with proprietary licenses that are expected
          # and reviewed at the lancedb dependency level, not anthill's direct dep list.
          EXCLUDED_PKG_PREFIXES = ("nvidia-", "cuda-", "cuda_", "libcublas", "libcufile",
                                   "libcurand", "libcusolver", "libcusparse")
          def is_excluded(name):
              n = name.lower()
              return any(n.startswith(p) for p in EXCLUDED_PKG_PREFIXES)

          def is_compatible(lic):
              key = lic.lower()
              return any(p in key for p in COMPATIBLE_PATTERNS)

          # A PEP 639 package can declare `License-File:` and ship the licence while omitting the old
          # `License:` field and classifier - pip-licenses then reports UNKNOWN even though the licence is
          # right there in the wheel (sigstore-models 0.0.6 is MIT, Astral Software Inc., exactly this).
          # Blocking on that is blocking on a metadata gap, not on an unlicensed dependency. So when the
          # metadata is silent, read what the package actually shipped and classify its title. A package
          # with neither metadata NOR a licence file still blocks - the gate keeps its teeth.
          def from_license_file(p):
              text = (p.get("LicenseText") or "").strip()
              if not text or text == "UNKNOWN":
                  return ""
              # The title lives in the first few lines ("MIT License", "Apache License Version 2.0"),
              # so match there rather than the body, where another licence may merely be mentioned.
              head = " ".join(text.splitlines()[:5]).lower()
              for spdx, needle in (
                  ("MIT", "mit license"),
                  ("Apache-2.0", "apache license"),
                  ("BSD", "bsd"),
                  ("ISC", "isc license"),
                  ("MPL-2.0", "mozilla public license"),
                  ("GPL", "gnu general public license"),
                  ("LGPL", "gnu lesser general public license"),
              ):
                  if needle in head:
                      return spdx
              return ""

          data = json.load(open("licenses.json"))
          unknown, flagged = [], []
          for p in data:
              name = p["Name"]
              if is_excluded(name):
                  continue
              lic = p["License"].strip()
              source = "metadata"
              if lic == "UNKNOWN":
                  recovered = from_license_file(p)
                  if recovered:
                      lic, source = recovered, "bundled LICENSE file"
                      print(f"::notice::{name}=={p['Version']} declares no license in its metadata; "
                            f"read '{lic}' from its {source}.")
              if lic == "UNKNOWN":
                  unknown.append((name, p["Version"]))
              elif not is_compatible(lic):
                  flagged.append((name, p["Version"], lic))
          for name, ver in unknown:
              print(f"::error::{name}=={ver} has UNKNOWN license and ships no license file - "
                    "check package metadata or vendor the license file.")
          for name, ver, lic in flagged:
              print(f"::warning::{name}=={ver} license '{lic}' is not in the "
                    "known-compatible set - verify AGPL-3.0 compatibility before merging.")
          if unknown:
              sys.exit(1)
          if not flagged:
              print("All dependency licenses are in the known-compatible set.")
          PYEOF
