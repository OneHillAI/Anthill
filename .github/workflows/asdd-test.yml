# ASDD operate - post-merge test run.
#
# Runs the project's test suite after a change lands on main and posts its pass/fail on the merged PR. It is
# deterministic: pytest runs the same command CI runs, the verdict is pytest's exit code and the counts come
# from its JUnit XML (.github/asdd/operate/test.sh). No model is involved, because counting passes is not a
# judgement, and a model endpoint that is down or a malformed reply used to record `asdd/test=error` on a
# green suite, which blocks Promote Beta. The run has no model key or secret in its environment.
#
# It triggers on push to main, so the input is TRUSTED (a human already reviewed and merged). It must NOT run
# automatically on untrusted pre-merge PR content: it executes the code under test, and a stranger's code
# needs a sandbox this repo does not have. A hand-started run must name a commit that is on main (below).
#
# It reports; it never merges and never edits code. Advisory: it posts a comment for a human to act on and
# records the `asdd/test` commit status Promote Beta reads. It installs the project's test dependencies and
# can be started by hand for a chosen commit.

name: ASDD test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      change_ref:
        description: "Commit (SHA) on main to run the tests against; default is the branch head"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write   # to record the test run's verdict on the commit (Promote Beta reads it)

concurrency:
  group: asdd-test-${{ inputs.change_ref || github.sha }}
  cancel-in-progress: false

env:
  CHANGE_REF: ${{ inputs.change_ref || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Re-runs the whole suite; cap it so a hung run cannot hold a runner.
    timeout-minutes: 30
    steps:
      - name: Check out the commit under test (need history for the change diff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CHANGE_REF }}
          fetch-depth: 50
          persist-credentials: false

      # The run executes the code under test, so it only ever runs on merged, trusted code. A push to
      # main satisfies that by construction; a hand-started run must name a commit that is on main.
      - name: Refuse any commit that is not on main
        id: onmain
        run: |
          git fetch --no-tags --depth=1000 origin main
          git merge-base --is-ancestor "$CHANGE_REF" FETCH_HEAD \
            || { echo "::error::${CHANGE_REF} is not on main; the post-merge test run only runs on merged code."; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # The run needs the project's test dependencies (the same extra CI installs).
      - name: Install the project's test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      # No env: block on purpose. This step runs the merged code, so no token or secret is passed to it.
      - name: Run the test suite (trusted post-merge input)
        run: bash .github/asdd/operate/test.sh "$CHANGE_REF" test-report.md

      - name: Post the result on the merged PR (or the commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -s test-report.md ] || { echo "no report; nothing to post"; exit 0; }
          body="$(cat test-report.md)"
          footer=$'\n\n<sub>Reported by the ASDD post-merge test run (deterministic pytest, advisory). A human acts on it. Nothing merges automatically.</sub>'
          # find the PR this commit merged, if any
          pr="$(gh api "repos/$REPO/commits/$CHANGE_REF/pulls" -H "Accept: application/vnd.github.groot-preview+json" --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "${pr:-}" ] && [ "$pr" != "null" ]; then
            printf '%s%s' "$body" "$footer" | gh pr comment "$pr" --repo "$REPO" --body-file -
            echo "posted on PR #$pr"
          else
            printf '%s%s' "$body" "$footer" | gh api "repos/$REPO/commits/$CHANGE_REF/comments" -f body=@- >/dev/null
            echo "posted as a commit comment (no associated PR)"
          fi

      # The structured verdict, recorded as a commit status (the mechanism CI already uses), so Promote Beta
      # reads a signal instead of parsing the report text. It is recorded even when pytest did not complete (then
      # the state is "error"), but only for a commit that passed the on-main check above.
      - name: Record the verdict as a commit status
        if: ${{ always() && steps.onmain.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          verdict="$(python3 .github/asdd/operate/test-report.py --verdict .asdd-work/operate-result.json 2>/dev/null || echo none)"
          case "$verdict" in
            pass) state=success; desc="Test run: PASS" ;;
            fail) state=failure; desc="Test run: FAIL" ;;
            *)    state=error;   desc="Test run: no verdict (pytest did not complete, or left no usable result)" ;;
          esac
          gh api "repos/$REPO/statuses/$CHANGE_REF" -f state="$state" -f context="asdd/test" -f description="$desc" >/dev/null
          echo "recorded asdd/test=$state on $CHANGE_REF"
