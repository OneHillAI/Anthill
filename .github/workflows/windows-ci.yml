# Windows CI: prove the backend, the installer and the self-update on Windows (spec: docs/specs/windows-support.md).
#
# It runs on the pull request itself, so nobody has to start it by hand, and only when the PR touches the backend build,
# the platform layer or the desktop shell (the paths below, which scripts/windows_ci_areas.py also uses, so they cannot
# drift apart). The backend, the one-file `anthill-server.exe` ("the sidecar"), is built and smoke-tested ONCE, then shared
# as an artifact with three jobs, so a PR no longer rebuilds it three times:
#
#   backend    the platform tests, then the frozen backend answers a chat with a real local model it downloads itself
#   installer  builds the real unsigned installer, installs it, runs it, crashes it, closes it and uninstalls it
#   update     builds two installers with a throwaway key and checks the old app updates itself to the new one
#
# A first job reads the changed files and runs only the jobs the change needs: a change to the Ollama code does not pay for
# two Tauri builds. Nothing here is signed with a real key or published, and the real update feed is never used. It is
# advisory: a path-filtered check cannot be a required one.
name: Windows CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-ci.yml"
      - "Anthill-sidecar.spec"
      - "anthill/desktop.py"
      - "anthill/hosting/sizing.py"
      - "anthill/inference/ollama.py"
      - "anthill/platform_layer.py"
      - "anthill/web/scheduler.py"
      - "pyproject.toml"
      - "requirements.lock"
      - "scripts/build-sidecar.sh"
      - "scripts/smoke_frozen_chat.py"
      - "scripts/windows_ci_areas.py"
      - "scripts/windows_installer_check.py"
      - "scripts/windows_update_check.py"
      - "src-tauri/**"
      - "tests/test_ollama_windows.py"
      - "tests/test_platform_layer.py"
      - "tests/test_windows_ci.py"
      - "tests/test_windows_installer_check.py"
      - "tests/test_windows_update_check.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-ci.yml"
      - "Anthill-sidecar.spec"
      - "anthill/desktop.py"
      - "anthill/hosting/sizing.py"
      - "anthill/inference/ollama.py"
      - "anthill/platform_layer.py"
      - "anthill/web/scheduler.py"
      - "pyproject.toml"
      - "requirements.lock"
      - "scripts/build-sidecar.sh"
      - "scripts/smoke_frozen_chat.py"
      - "scripts/windows_ci_areas.py"
      - "scripts/windows_installer_check.py"
      - "scripts/windows_update_check.py"
      - "src-tauri/**"
      - "tests/test_ollama_windows.py"
      - "tests/test_platform_layer.py"
      - "tests/test_windows_ci.py"
      - "tests/test_windows_installer_check.py"
      - "tests/test_windows_update_check.py"

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Which Windows checks this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      shell: ${{ steps.areas.outputs.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Read the changed files
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/changed.txt"
            python3 scripts/windows_ci_areas.py < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed.txt"
            python3 scripts/windows_ci_areas.py < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          else
            python3 scripts/windows_ci_areas.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  sidecar:
    name: Windows sidecar builds and passes its smoke test
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.shell == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: dtolnay/rust-toolchain@stable

      # Builds the one-file backend with PyInstaller, runs the self-checks, boots it, signs up, runs one chat against a
      # fake model and checks it stops when its launcher is killed (scripts/build-sidecar.sh).
      - name: Build the anthill-server sidecar and smoke-test it
        run: bash scripts/build-sidecar.sh

      # Already compressed, so store it as it is.
      - name: Share the sidecar with the jobs that need it
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-sidecar
          path: dist/anthill-server.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  backend:
    name: Windows backend answers with a real local model
    needs: [changes, sidecar]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Get the sidecar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-sidecar
          path: dist

      # The platform-layer tests use real child processes, so they run here as well as on Linux.
      - name: Platform-layer tests
        run: |
          uv venv --python 3.11 .test-venv
          uv pip install --python .test-venv/Scripts/python.exe --require-hashes -r requirements.lock
          uv pip install --python .test-venv/Scripts/python.exe --no-deps -e .
          uv pip install --python .test-venv/Scripts/python.exe pytest
          .test-venv/Scripts/python.exe -m pytest tests/test_platform_layer.py tests/test_ollama_windows.py tests/test_smoke_frozen_chat.py -q

      # The backend fetches and starts its own Ollama here (about 1.5 GB), exactly as on a user's first run, and a
      # 400 MB model is pulled and answers the chat (Windows runners have no GPU, so this is the CPU path).
      - name: Real local model smoke test
        timeout-minutes: 45
        run: |
          .test-venv/Scripts/python.exe scripts/smoke_frozen_chat.py "$PWD/dist/anthill-server.exe" --real-ollama qwen2.5:0.5b

      - name: Stop Ollama
        if: always()
        run: taskkill //F //IM ollama.exe || true

  installer:
    name: Windows installer builds, installs, runs and uninstalls
    needs: [changes, sidecar]
    if: ${{ needs.changes.outputs.shell == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      # Cache the Rust build (registry + src-tauri/target) so re-runs do not recompile the whole dependency tree.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The shell bundles the backend as `binaries/anthill-server-<target>.exe` (what scripts/build-sidecar.sh would place).
      - name: Get the sidecar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-sidecar
          path: dist

      - name: Place the sidecar where the shell expects it
        run: |
          mkdir -p src-tauri/binaries
          cp dist/anthill-server.exe src-tauri/binaries/anthill-server-x86_64-pc-windows-msvc.exe

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # Tauri embeds the icons at build time and src-tauri/icons is not committed, so generate the set first.
      - name: Generate app icons
        run: tauri icon assets/anthill-icon-1024.png

      # Pull requests have no updater signing key, so the build must not try to produce signed update bundles.
      - name: Build the installer (unsigned, no update bundles)
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/ci.conf.json"
          tauri build --bundles nsis --config "$RUNNER_TEMP/ci.conf.json"
          ls -la src-tauri/target/release/bundle/nsis/

      - name: Install it, run it, crash it, close it, uninstall it
        run: |
          INSTALLER=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          python scripts/windows_installer_check.py "$INSTALLER"

      - name: Stop anything left running
        if: always()
        run: |
          taskkill //F //IM anthill-desktop.exe || true
          taskkill //F //IM anthill-server.exe || true
          taskkill //F //IM ollama.exe || true

  update:
    name: Windows app updates itself to the next version
    needs: [changes, sidecar]
    if: ${{ needs.changes.outputs.shell == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      FEED: http://127.0.0.1:8765/latest.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get the sidecar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-sidecar
          path: dist

      - name: Place the sidecar where the shell expects it
        run: |
          mkdir -p src-tauri/binaries
          cp dist/anthill-server.exe src-tauri/binaries/anthill-server-x86_64-pc-windows-msvc.exe

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Generate app icons
        run: tauri icon assets/anthill-icon-1024.png

      # A key made for this run only. The public half goes into the old build; the private half signs both installers.
      - name: Make a throwaway update-signing key
        run: tauri signer generate --ci -w "$RUNNER_TEMP/updater.key"

      # Two configuration overlays: the version, the throwaway public key, and the local feed (plain http is allowed
      # for this test build only; the signature is still checked).
      - name: Write the two configuration overlays
        run: |
          python - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          pub = (temp / "updater.key.pub").read_text().strip()
          for version in ("0.9.1", "0.9.2"):
              overlay = {
                  "version": version,
                  "bundle": {"createUpdaterArtifacts": True},
                  "plugins": {"updater": {
                      "pubkey": pub,
                      "endpoints": [os.environ["FEED"]],
                      "dangerousInsecureTransportProtocol": True,
                  }},
              }
              (temp / f"v{version}.conf.json").write_text(json.dumps(overlay))
          PY

      - name: Build the old installer (0.9.1)
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/updater.key")"
          rm -rf src-tauri/target/release/bundle/nsis
          tauri build --bundles nsis --config "$RUNNER_TEMP/v0.9.1.conf.json"
          mkdir -p "$RUNNER_TEMP/old"
          cp src-tauri/target/release/bundle/nsis/Anthill_0.9.1_x64-setup.exe "$RUNNER_TEMP/old/"

      - name: Build the new installer (0.9.2) and its signature
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/updater.key")"
          rm -rf src-tauri/target/release/bundle/nsis
          tauri build --bundles nsis --config "$RUNNER_TEMP/v0.9.2.conf.json"
          mkdir -p "$RUNNER_TEMP/new"
          cp src-tauri/target/release/bundle/nsis/Anthill_0.9.2_x64-setup.exe src-tauri/target/release/bundle/nsis/Anthill_0.9.2_x64-setup.exe.sig "$RUNNER_TEMP/new/"
          ls -la "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"

      - name: Install the old build and watch it update itself
        run: |
          OLD="$RUNNER_TEMP/old/Anthill_0.9.1_x64-setup.exe"
          NEW="$RUNNER_TEMP/new/Anthill_0.9.2_x64-setup.exe"
          python scripts/windows_update_check.py "$OLD" "$NEW" "$NEW.sig" --new-version 0.9.2

      - name: Stop anything left running
        if: always()
        run: |
          taskkill //F //IM anthill-desktop.exe || true
          taskkill //F //IM anthill-server.exe || true
          taskkill //F //IM ollama.exe || true
