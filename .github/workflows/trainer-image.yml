name: trainer-image

# Builds + publishes the GPU trainer image to GHCR. Manual / tag-triggered ONLY (never on normal PRs):
# the image is multi-GB CUDA and is validated on a real GPU host by the owner, so it must not run in
# the model-free PR CI. Tag `trainer-vX.Y.Z` or run the workflow by hand to publish.
on:
  workflow_dispatch:
  push:
    tags:
      - "trainer-v*"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.trainer
          push: true
          tags: ghcr.io/onehillai/anthill-trainer:latest
